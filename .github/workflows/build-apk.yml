name: Build debug APK

on:
  push:
    branches:
      - main
      - claude/kc-diamonds-stats-app-r7de5h
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # The debug signing keystore is stored base64-encoded in the repo;
      # the build expects it at ${rootDir}/debug.keystore.
      - name: Restore debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kc-diamonds-stats-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Also publish the APK to a rolling "latest-apk" release, so it can be
      # downloaded with one tap from any phone browser (no sign-in, no zip):
      # https://github.com/inspectorgad/markdown/releases/latest/download/kc-diamonds.apk
      #
      # The asset is renamed off Gradle's generic app-debug.apk: the KU
      # Volleyball app publishes its own build under exactly that name, so
      # downloading both left two indistinguishable files on the phone.
      - name: Publish APK to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-apk --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create latest-apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "KC Diamonds Stats - latest build" \
              --notes "Rolling release: always carries the newest APK with current season data. Download kc-diamonds.apk below and install it on your Android device." \
              --latest
          cp app/build/outputs/apk/debug/app-debug.apk kc-diamonds.apk
          gh release upload latest-apk kc-diamonds.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
          # Drop the pre-rename asset so the old ambiguous name cannot linger
          # on the release. A no-op once it is gone.
          gh release delete-asset latest-apk app-debug.apk \
            --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          # The parsed season data rides along so the app can sync itself
          # without an APK reinstall.
          cp app/src/main/assets/seed.json season-data.json
          gh release upload latest-apk season-data.json \
            --repo "$GITHUB_REPOSITORY" --clobber
