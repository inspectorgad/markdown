name: Build debug APK

on:
  push:
    branches:
      - main
      - claude/kc-diamonds-stats-app-r7de5h
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # The debug signing keystore is stored base64-encoded in the repo;
      # the build expects it at ${rootDir}/debug.keystore.
      - name: Restore debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kc-diamonds-stats-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
