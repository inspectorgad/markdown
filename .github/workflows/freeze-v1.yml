name: Freeze v1 stable release

# One-off: snapshots the current kc-diamonds.apk from the rolling latest-apk
# release into an immutable v1-stable release, as a permanent known-good
# fallback build that later development never overwrites.
on:
  push:
    branches:
      - claude/kc-diamonds-stats-app-r7de5h
    paths:
      - 'freeze-v1-trigger.txt'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot current APK into v1-stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1-stable --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v1-stable already exists; leaving it untouched."
            exit 0
          fi
          gh release download latest-apk --repo "$GITHUB_REPOSITORY" --pattern kc-diamonds.apk
          # --latest=false keeps the rolling latest-apk release as the target
          # of /releases/latest/download/ URLs.
          gh release create v1-stable kc-diamonds.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "KC Diamonds Stats v1 (stable fallback)" \
            --notes "Frozen known-good build (July 16, 2026): full 2026 season data baked in, updated via APK reinstalls. Keep this as the rollback if a newer build misbehaves - it installs directly over any newer version and keeps all app data."
