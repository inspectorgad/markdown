name: Scrape KU volleyball data

on:
  workflow_dispatch:
  # Nightly at 09:00 UTC (4 AM Central) — after even late matches are final.
  # Note: GitHub only fires cron for workflows on the default branch, so this
  # activates once the app is merged to main. Until then the nightly update is
  # driven by pushes to scrape-trigger.txt.
  schedule:
    - cron: '0 9 * * *'
  push:
    branches:
      - claude/ku-volleyball-app-feasibility-c4se1m
    paths:
      - 'scrape-trigger.txt'
      - 'scripts/scrape-ku-volleyball.mjs'
      - 'scripts/update-seed.py'
      - '.github/workflows/scrape-data.yml'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ku-volleyball-app-feasibility-c4se1m

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: |
          npm init -y > /dev/null
          npm install playwright@1.49.0 > /dev/null
          npx playwright install --with-deps chromium

      - name: Scrape NCAA + kuathletics data
        env:
          SEASONS: '2025 2026'
        run: node scripts/scrape-ku-volleyball.mjs

      - name: Rebuild seed from scraped data
        run: python3 scripts/update-seed.py

      - name: Commit scraped data and seed update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f scraped/
          git diff --cached --quiet || git commit -m "Update scraped KU volleyball data [skip ci]"
          # Seed commit is separate and NOT [skip ci], so new season data
          # triggers the APK build workflow.
          git add app/src/main/assets/seed.json
          git diff --cached --quiet || git commit -m "Update season data from nightly scrape"
          git push
