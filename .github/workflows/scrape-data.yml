name: Scrape KC Diamonds data

on:
  workflow_dispatch:
  # Nightly at 09:00 UTC (4 AM Central) — after even late games are final.
  # Note: GitHub only fires cron for workflows on the default branch, so this
  # activates once the app is merged to main. Until then the nightly update is
  # driven by a scheduled Claude session that pushes to scrape-trigger.txt.
  schedule:
    - cron: '0 9 * * *'
  push:
    branches:
      - claude/kc-diamonds-stats-app-r7de5h
    paths:
      - 'scrape-trigger.txt'
      - 'scripts/scrape-kc-diamonds.mjs'
      - '.github/workflows/scrape-data.yml'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/kc-diamonds-stats-app-r7de5h

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: |
          npm init -y > /dev/null
          npm install playwright@1.49.0 > /dev/null
          npx playwright install --with-deps chromium

      - name: Scrape pages
        run: node scripts/scrape-kc-diamonds.mjs

      - name: Fold new box scores into seed data
        run: python3 scripts/update-seed.py

      - name: Commit scraped data and seed update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f scraped/
          git diff --cached --quiet || git commit -m "Update scraped KC Diamonds data [skip ci]"
          SEED_CHANGED=0
          git add app/src/main/assets/seed.json
          git diff --cached --quiet || { git commit -m "Update season data from nightly scrape"; SEED_CHANGED=1; }
          git push
          # Pushes made with GITHUB_TOKEN do not trigger other workflows, so
          # the in-app sync feed must be refreshed from here directly.
          if [ "$SEED_CHANGED" = "1" ]; then
            cp app/src/main/assets/seed.json season-data.json
            gh release upload latest-apk season-data.json \
              --repo "$GITHUB_REPOSITORY" --clobber
          fi
