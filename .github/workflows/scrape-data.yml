name: Scrape KC Diamonds data

on:
  workflow_dispatch:
  # Every six hours, on the :07. One nightly run at 09:00 with a 13:00 backstop
  # had two problems, and this addresses both.
  #
  # Delivery. GitHub's scheduler is best-effort: it drops runs under load (this
  # cron and the KU volleyball one both never queued on 2026-08-27) and it queues
  # them late - through late August it ran five to eight hours behind. The top of
  # the hour is the most congested minute there is, since it is what nearly every
  # cron in the world asks for, so these now sit at :07. A dropped or slow entry
  # costs six hours instead of a day.
  #
  # Coverage. Delivered punctually, 09:00 and 13:00 only look at the morning, so
  # a Sunday afternoon game finishing at 20:00 UTC waited until the next day. The
  # volleyball repo lost sixteen hours to exactly that on 2026-08-30.
  #
  # Four runs a day rather than volleyball's six because a run here takes about
  # seventeen minutes, nearly all of it waiting on thekcdiamonds.com and
  # BallClubz - it is their bandwidth as much as ours. Games are weekend
  # tournaments, so six-hourly still puts a result in the app within a few hours
  # of the final. The scrape is idempotent, verify-seed still gates the seed
  # fail-closed, and the feed upload compares digests rather than assuming this
  # run changed something.
  schedule:
    - cron: '7 2 * * *'
    - cron: '7 8 * * *'
    - cron: '7 14 * * *'
    - cron: '7 20 * * *'
  push:
    branches:
      - main
    paths:
      - 'scrape-trigger.txt'
      - 'scripts/scrape-kc-diamonds.mjs'
      - '.github/workflows/scrape-data.yml'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      # No pinned ref: cron and push runs both operate on main.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: |
          npm init -y > /dev/null
          npm install playwright@1.49.0 > /dev/null
          npx playwright install --with-deps chromium

      - name: Scrape pages
        run: node scripts/scrape-kc-diamonds.mjs

      - name: Fold into seed, verify, and commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # scraped/ is this run's raw capture and is always authoritative, so
          # keep it outside the work tree while we move the branch around.
          mkdir -p /tmp/capture && cp -a scraped/. /tmp/capture/

          # A scrape takes ~15 minutes, so main will often have moved on while
          # it ran. Rather than rebasing a commit built against a stale tree
          # (which conflicts on regenerated files), rewind to whatever landed,
          # drop the fresh capture on top, and re-derive the seed with main's
          # current parser.
          # Cross-checking against the official aggregates gates the SEED only.
          # The raw capture is committed either way: a failed verify used to
          # discard the entire run, taking with it the very files needed to
          # diagnose the failure, so the same bad parse could not be
          # investigated without waiting for another 15-minute scrape.
          VERIFIED=1
          rebuild() {
            git fetch origin main
            git reset --hard origin/main
            rm -rf scraped && mkdir -p scraped && cp -a /tmp/capture/. scraped/
            python3 scripts/update-seed.py
            VERIFIED=1
            python3 scripts/verify-seed.py || VERIFIED=0
            if [ "$VERIFIED" = "0" ]; then
              echo "::error::verify-seed failed - keeping the capture as evidence, NOT shipping the seed"
              git checkout -- app/src/main/assets/seed.json
            fi
          }

          rebuild
          SEED_CHANGED=0
          PUSHED=0
          for attempt in 1 2 3; do
            git add -f scraped/
            git diff --cached --quiet || git commit -m "Update scraped KC Diamonds data [skip ci]"
            SEED_CHANGED=0
            if [ "$VERIFIED" = "1" ]; then
              git add app/src/main/assets/seed.json
              git diff --cached --quiet || { git commit -m "Update season data from nightly scrape"; SEED_CHANGED=1; }
            fi
            if git push; then PUSHED=1; break; fi
            echo "push rejected (attempt $attempt); re-deriving on top of latest main"
            sleep $((attempt * 5))
            rebuild
          done
          if [ "$PUSHED" != "1" ]; then
            echo "::error::could not push the scrape after 3 attempts"
            exit 1
          fi
          # The capture is safely committed; now fail loudly so the alert fires.
          if [ "$VERIFIED" = "0" ]; then
            echo "::error::seed rejected by verify-seed; capture committed for diagnosis"
            exit 1
          fi
          # Pushes made with GITHUB_TOKEN do not trigger other workflows, so
          # the in-app sync feed must be refreshed from here directly.
          # Reconcile on content, not on "did this run change something". A seed
          # corrected out-of-band (a bad parse rolled back by hand) left the
          # feed serving the bad copy, because that run reported no change and
          # skipped the upload. Compare digests instead so the feed converges.
          cp app/src/main/assets/seed.json season-data.json
          LOCAL=$(sha256sum season-data.json | cut -d' ' -f1)
          REMOTE=$(gh release view latest-apk --repo "$GITHUB_REPOSITORY" \
            --json assets --jq \
            '.assets[] | select(.name=="season-data.json") | .digest' 2>/dev/null \
            | sed 's/^sha256://')
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "refreshing feed: local $LOCAL != release ${REMOTE:-none}"
            gh release upload latest-apk season-data.json \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "feed already matches the seed ($LOCAL)"
          fi
