name: Scrape KC Diamonds data

on:
  workflow_dispatch:
  push:
    branches:
      - claude/kc-diamonds-stats-app-r7de5h
    paths:
      - 'scrape-trigger.txt'
      - 'scripts/scrape-kc-diamonds.mjs'
      - '.github/workflows/scrape-data.yml'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: |
          npm init -y > /dev/null
          npm install playwright@1.49.0 > /dev/null
          npx playwright install --with-deps chromium

      - name: Scrape pages
        run: node scripts/scrape-kc-diamonds.mjs

      - name: Commit scraped data to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f scraped/
          git diff --cached --quiet || git commit -m "Add scraped KC Diamonds data [skip ci]"
          git push
