name: Delete the stale KU Volleyball release

# One-shot cleanup. The KU Volleyball app was briefly built in this repo before
# it moved to inspectorgad/ku-volleyball, and its "ku-volleyball-apk" release
# was left behind. Nothing has referenced it since 2026-07-17, so it serves a
# three-week-old build under the ambiguous names app-debug.apk / app-release.aab
# that the rename deliberately retired.
#
# The real volleyball release lives at:
#   https://github.com/inspectorgad/ku-volleyball/releases/tag/latest-apk
#
# Delete this workflow once it has run.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/delete-stale-volleyball-release.yml'

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Remove ku-volleyball-apk and its orphaned tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view ku-volleyball-apk --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "ku-volleyball-apk is already gone; nothing to do."
            exit 0
          fi
          echo "Assets about to be deleted:"
          gh release view ku-volleyball-apk --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | "  \(.name)  \(.size) bytes"'
          gh release delete ku-volleyball-apk \
            --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          echo "Deleted. Remaining releases:"
          gh release list --repo "$GITHUB_REPOSITORY"
